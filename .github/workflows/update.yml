name: Update storage data
on:
  schedule:
    - cron: "*/10 14-17 * * 3-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_storage.py
      - name: Check price reaction
        run: python price_reaction.py
        continue-on-error: true
      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json reactions.json
          git diff --staged --quiet || (git commit -m "Update storage data" && git push)
